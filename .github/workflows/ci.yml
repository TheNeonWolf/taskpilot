name: CI Build Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          npx prisma generate

      - name: Typecheck and Build Next.js
        run: npm run build
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/db"
          JWT_SECRET: "ci-dummy-secret-key-12345"
          GEMINI_API_KEY: "ci-dummy-key"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Stack
        run: docker compose build